version: '3.8'

services:
  # Optional Ollama service - can be commented out if not needed
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - resume-network

  resume-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-service
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - ENABLE_AI=${ENABLE_AI:-true}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - DOWNLOAD_MODEL=${DOWNLOAD_MODEL:-true}
    volumes:
      - ./data:/app/data
      - ./resources:/app/resources
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - resume-network

volumes:
  ollama-data:

networks:
  resume-network:
    driver: bridge