{% block scripts %}
<script type="text/javascript">
    // Use let/const to avoid accidental globals and provide better scoping
    function commit_value(commit_id) {
        console.log(commit_id);
        const el = document.getElementById(commit_id);
        // Try to get .value, fallback to .innerText
        let currentValue = '';
        if (el) {
            if ('value' in el) {
                currentValue = el.value;
            } else if ('innerText' in el) {
                currentValue = el.innerText;
            }
        }
        console.log(currentValue);
        // For input fields, set the property, not attribute
        if ('value' in el) {
            el.value = currentValue;
        } else {
            el.setAttribute('value', currentValue);
        }
    }

    // Always use class selectors for dynamic content and to avoid ID duplication
    $("body").on("click", ".deleteRow", function () {
        const div_id = $(this).closest("div").attr("id");
        if (div_id) {
            $("#" + div_id).remove();
            $("#newinput").append(
                `<input type="hidden" id="${div_id}_delete" name="${div_id}_delete" value="True">`
            );
        }
    });

    // Handle dropdown change events
    $("body").on("change", ".dropdown", function () {
        const dropdown = $(this);
        const selectedValue = dropdown.val();
        const selectedText = dropdown.find("option:selected").text();
        const currentId = dropdown.attr('name');
        const prefix_builder = currentId ? currentId.split("_") : [];

        // Get rowId (e.g., "1" from "1_school_dropdown")
        const rowId = prefix_builder.length >= 1 ? prefix_builder[0] : '';

        // Get field type (e.g., "school" from "1_school_dropdown")
        const fieldType = prefix_builder.length >= 2 ? prefix_builder[1] : '';

        const selectedName =
            prefix_builder.length === 3
                ? prefix_builder[0] + "_" + prefix_builder[1]
                : prefix_builder[0] || '';

        // If a normal value is selected (not EDIT/ADD), update the hidden fields
        if (selectedValue !== "EDIT" && selectedValue !== "ADD") {
            // Update the name field with the text from the selected option
            const nameField = $(`#${rowId}_${fieldType}_name`);
            if (nameField.length) {
                nameField.val(selectedText);
            }

            // For school dropdowns, potentially look up the location if available in data attributes
            if (fieldType === "school") {
                // If you have school location data available, update it
                // This assumes you might add data-location attributes to your options in the future
                const locationData = dropdown.find("option:selected").attr('data-location');
                if (locationData) {
                    $(`#${rowId}_school_location`).val(locationData);
                }
            }

            // Store the selected value in the data attributes for potential future reference
            if (fieldType === "school") {
                dropdown.attr('data-school-id', selectedValue);
            } else if (fieldType === "focus") {
                dropdown.attr('data-focus-id', selectedValue);
            }
        }

        switch (selectedValue) {
            case "EDIT":
                $(`#${selectedName}_div`).removeClass("d-none");
                dropdown.prop("disabled", true);
                break;
            case "ADD":
                $(`#${selectedName}_div`).addClass("d-none");
                dropdown.prop("disabled", false);
                break;
            default:
                $(`#${selectedName}_div`).addClass("d-none");
                dropdown.prop("disabled", false);
                break;
        }
    });

    // Initialize on page load: sync any dropdowns with their corresponding fields
    $(document).ready(function() {
        $(".dropdown").each(function() {
            // Trigger the change event to initialize all fields correctly
            $(this).trigger("change");
        });

        // =====================================================
        // Position dropdown handler
        // =====================================================
        const positionDropdowns = document.querySelectorAll('[id$="_position_dropdown"]');
        positionDropdowns.forEach(dropdown => {
            dropdown.addEventListener('change', function() {
                const selectedId = this.value;
                const currentRowId = this.id.split('_')[0]; // Get the current row ID

                // Only proceed if a position was selected (not EDIT or ADD)
                if (selectedId !== 'EDIT' && selectedId !== 'ADD' && selectedId !== currentRowId) {
                    // Find the position data from the selected position
                    const selectedPosition = document.getElementById(selectedId + '_position');
                    if (selectedPosition) {
                        // Update current position name with the selected position's name
                        const currentPosition = document.getElementById(currentRowId + '_position');
                        if (currentPosition) {
                            currentPosition.value = selectedPosition.value;
                        }
                    }
                }
            });
        });

        // =====================================================
        // Employer dropdown handler for achievements
        // =====================================================
        const employerDropdowns = document.querySelectorAll('[id$="_employer_dropdown"]');
        employerDropdowns.forEach(dropdown => {
            dropdown.addEventListener('change', function() {
                const selectedId = this.value;
                const currentRowId = this.id.split('_')[0]; // Get the current row ID

                // Only proceed if an employer was selected (not EDIT or ADD)
                if (selectedId !== 'EDIT' && selectedId !== 'ADD' && selectedId !== currentRowId) {
                    // Find the employer data from the selected employer
                    const selectedEmployer = document.getElementById(selectedId + '_employer');
                    if (selectedEmployer) {
                        // Update current employer name with the selected employer's name
                        const currentEmployer = document.getElementById(currentRowId + '_employer');
                        if (currentEmployer) {
                            currentEmployer.value = selectedEmployer.value;
                        }
                    }

                    // Also update location if it exists
                    const selectedLocation = document.getElementById(selectedId + '_location');
                    if (selectedLocation) {
                        const currentLocation = document.getElementById(currentRowId + '_location');
                        if (currentLocation) {
                            currentLocation.value = selectedLocation.value;
                        }
                    }
                }
            });
        });

        // =====================================================
        // Achievement-specific position dropdown handler
        // =====================================================
        const achievementPositionDropdowns = document.querySelectorAll('[id$="_achievement_position_dropdown"]');
        achievementPositionDropdowns.forEach(dropdown => {
            dropdown.addEventListener('change', function() {
                const selectedId = this.value;
                const currentRowId = this.id.split('_')[0]; // Get the current row ID

                // Only proceed if a position was selected (not EDIT or ADD)
                if (selectedId !== 'EDIT' && selectedId !== 'ADD' && selectedId !== currentRowId) {
                    // Find the position data from the selected position
                    const selectedPosition = document.getElementById(selectedId + '_position');
                    if (selectedPosition) {
                        // Update current position name with the selected position's name
                        const currentPosition = document.getElementById(currentRowId + '_achievement_position');
                        if (currentPosition) {
                            currentPosition.value = selectedPosition.value;
                        }
                    }
                }
            });
        });

        // =====================================================
        // Achievement state/display checkbox handler
        // =====================================================
        const stateCheckboxes = document.querySelectorAll('[id$="_enabled"], [id$="_achievement_enabled"]');
        stateCheckboxes.forEach(checkbox => {
            // Initial setup based on data attribute
            const state = checkbox.getAttribute('data-state') || checkbox.getAttribute('data-achievement-state');
            if (state) {
                checkbox.checked = (state === '1' || state === 'true');
            }

            // Add change event listener
            checkbox.addEventListener('change', function() {
                const idParts = this.id.split('_');
                const currentRowId = idParts[0];
                const fieldType = idParts.slice(1).join('_').replace('_enabled', '');

                // Look for state fields that might be in different formats
                const possibleStateFields = [
                    document.getElementById(currentRowId + '_' + fieldType + '_state'),
                    document.getElementById(currentRowId + '_achievement_state'),
                    document.getElementById(currentRowId + '_state'),
                    document.querySelector(`input[name="${currentRowId}_state"]`)
                ];

                // Update the first state field found
                for (const field of possibleStateFields) {
                    if (field) {
                        field.value = this.checked ? "1" : "0";
                        break;
                    }
                }

                // Update the data attribute for consistency
                if (this.id.includes('achievement')) {
                    this.setAttribute('data-achievement-state', this.checked ? "1" : "0");
                } else {
                    this.setAttribute('data-state', this.checked ? "1" : "0");
                }
            });
        });

        // =====================================================
        // Initialize all checkbox states on page load
        // =====================================================
        document.querySelectorAll('[data-state], [data-achievement-state]').forEach(element => {
            if (element.tagName === 'INPUT' && element.type === 'checkbox') {
                const stateValue = element.getAttribute('data-state') || element.getAttribute('data-achievement-state');
                element.checked = (stateValue === '1' || stateValue === 'true');
            }
        });
    });
</script>
{% endblock %}
