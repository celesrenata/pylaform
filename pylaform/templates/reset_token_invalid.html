{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <i class="bi bi-exclamation-triangle" style="font-size: 3rem; color: var(--bs-warning);"></i>
                    </div>

                    <h1 class="h3 mb-3">Invalid or Expired Link</h1>
                    <p class="text-muted mb-4">
                        The password reset link you clicked is invalid or has expired.
                        Password reset links are valid for 24 hours after they are created.
                    </p>

                    <div class="d-grid gap-2">
                        <a href="{{ url_for('forgot_password') }}" class="btn btn-primary">Request a New Link</a>
                        <a href="{{ url_for('login') }}" class="btn btn-outline-secondary">Return to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
