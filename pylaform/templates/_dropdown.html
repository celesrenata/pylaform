{% macro drop_down(id, payload, ddpayload, type, secondary=None, secondaryid=None, secondarybyname=False, primarybyname=False, extra=True, selected=None) %}
    {% if type == "employer" %}
        <select class="form-select" id="{{ id }}_{{ type }}_dropdown" name="{{ id }}_{{ type }}_dropdown">
            <option value="">Select Employer</option>
            {% if extra %}
                <option value="EDIT" {% if selected == "EDIT" %}selected{% endif %}>Add New Employer</option>
            {% endif %}
            {% for employer in ddpayload.get('employers', []) %}
                <option value="{{ employer.SK }}"
                    {% if selected is not none and (selected == employer.SK or selected == employer.name) %}selected{% endif %}>
                    {{ employer.name }}
                </option>
            {% endfor %}
        </select>
        <!-- Hidden input for storing the actual value -->
        <input type="hidden" id="{{ id }}_employer" name="{{ id }}_employer" value="">
    {% elif type == "position" %}
        <select class="form-select" id="{{ id }}_{{ type }}_dropdown" name="{{ id }}_{{ type }}_dropdown">
            <option value="">Select Position</option>
            {% if extra %}
                <option value="EDIT" {% if selected == "EDIT" %}selected{% endif %}>Add New Position</option>
            {% endif %}
            {% for position in ddpayload.get('positions', []) %}
                <option value="{{ position.SK }}"
                    {% if selected is not none and (selected == position.SK or selected == position.title) %}selected{% endif %}>
                    {{ position.title }}
                </option>
            {% endfor %}
        </select>
        <!-- Hidden input for storing the actual value -->
        <input type="hidden" id="{{ id }}_position" name="{{ id }}_position" value="">
    {% else %}
        <!-- Other dropdown types can be implemented here as needed -->
    {% endif %}
{% endmacro %}
