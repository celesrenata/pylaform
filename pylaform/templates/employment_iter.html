{% macro form_group(employerid, employername, location, employerstate, positionid, positionname, startdate, enddate, positionstate, ddpayload) %}
<div id="{{ positionid }}_row" class="mb-4">
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="{{ positionid }}_employer_dropdown">Employer:</label>
                <select class="form-control employer-dropdown" id="{{ positionid }}_employer_dropdown" name="{{ positionid }}_employer_dropdown">
                    <optgroup label="Employers">
                        {% for employer_id, employer_name in ddpayload.get("employer", []) %}
                        <option value="{{ employer_id }}"
                                {% if employerid|string == employer_id|string %}selected{% endif %}>
                            {{ employer_name }}
                        </option>
                        {% endfor %}
                    </optgroup>
                    <option value="EDIT" {% if employerid == "new" or employerid == "edit" %}selected{% endif %}>Edit...</option>
                    <option value="ADD">Add New...</option>
                </select>

                <!-- Hidden employer fields -->
                <input type="hidden" id="{{ positionid }}_rowid" name="{{ positionid }}_rowid" value="{{ positionid }}">
                <input type="hidden" id="{{ positionid }}_employer_id" name="{{ positionid }}_employer_id" value="{{ employerid }}">
                <input type="hidden" id="{{ positionid }}_employer" name="{{ positionid }}_employer" value="{{ employername }}">

                <!-- Employer edit fields (initially hidden) -->
                <div class="employer-edit-div d-none" id="{{ positionid }}_employer_div">
                    <div class="form-group mt-2">
                        <label for="{{ positionid }}_employer_name">Employer Name:</label>
                        <input type="text" class="form-control" id="{{ positionid }}_employer_name"
                               name="{{ positionid }}_employer_name" value="{{ employername }}">
                    </div>
                    <div class="form-group mt-2">
                        <label for="{{ positionid }}_location">Location:</label>
                        <input type="text" class="form-control" id="{{ positionid }}_location"
                               name="{{ positionid }}_location" value="{{ location }}">
                    </div>
                    <div class="form-check mt-2">
                        <input type="checkbox" class="form-check-input" id="{{ positionid }}_employer_enabled"
                               name="{{ positionid }}_employer_enabled" {% if employerstate %}checked{% endif %}>
                        <label class="form-check-label" for="{{ positionid }}_employer_enabled">Display this employer</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="form-group">
                <label for="{{ positionid }}_position_dropdown">Position:</label>
                <select class="form-control position-dropdown" id="{{ positionid }}_position_dropdown" name="{{ positionid }}_position_dropdown">
                    <optgroup label="Positions">
                        {% for position_id, position_name, employer_id in ddpayload.get("position", []) %}
                        <option value="{{ position_id }}"
                                data-employer-id="{{ employer_id }}"
                                {% if positionid|string == position_id|string %}selected{% endif %}>
                            {{ position_name }}
                        </option>
                        {% endfor %}
                    </optgroup>
                    <option value="EDIT" {% if positionid == "new" or positionid == "edit" %}selected{% endif %}>Edit...</option>
                    <option value="ADD">Add New...</option>
                </select>

                <!-- Hidden position fields -->
                <input type="hidden" id="{{ positionid }}_position_id" name="{{ positionid }}_position_id" value="{{ positionid }}">
                <input type="hidden" id="{{ positionid }}_position" name="{{ positionid }}_position" value="{{ positionname }}">

                <!-- Position edit fields (initially hidden) -->
                <div class="position-edit-div d-none" id="{{ positionid }}_position_div">
                    <div class="form-group mt-2">
                        <label for="{{ positionid }}_position_name">Position Title:</label>
                        <input type="text" class="form-control" id="{{ positionid }}_position_name"
                               name="{{ positionid }}_position_name" value="{{ positionname }}">
                    </div>
                    <div class="form-check mt-2">
                        <input type="checkbox" class="form-check-input" id="{{ positionid }}_position_enabled"
                               name="{{ positionid }}_position_enabled" {% if positionstate %}checked{% endif %}>
                        <label class="form-check-label" for="{{ positionid }}_position_enabled">Display this position</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-6">
            <div class="form-group">
                <label for="{{ positionid }}_startdate">Start Date:</label>
                <input type="text" class="form-control" id="{{ positionid }}_startdate"
                       name="{{ positionid }}_startdate" value="{{ startdate }}">
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group">
                <label for="{{ positionid }}_enddate">End Date:</label>
                <input type="text" class="form-control" id="{{ positionid }}_enddate"
                       name="{{ positionid }}_enddate" value="{{ enddate }}">
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-12 text-end">
            <button type="button" class="btn btn-danger deleteRow">Remove</button>
        </div>
    </div>

    <hr>
</div>
{% endmacro %}
