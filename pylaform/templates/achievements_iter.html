
{% macro form_group(employer, employername, employerstate, position, positionname, positionstate, achievement, shortdesc, longdesc, achievementstate, employertype="employer", ddpayload=None) %}
<div id="{{ achievement }}_row">
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="{{ achievement }}_employer_dropdown">Organization:</label>
                <select class="form-control employer-dropdown" id="{{ achievement }}_employer_dropdown" name="{{ achievement }}_employer_dropdown">
                    <!-- Group for schools/colleges -->
                    <optgroup label="Schools/Colleges">
                        {% for item in ddpayload.get("schools", []) %}
                        <option value="school_{{ item.id }}"
                                data-org-type="school"
                                {% if employer|string == item.id|string and employertype == "school" %}selected{% endif %}>
                                {{ item.name }} (College)
                        </option>
                        {% endfor %}
                    </optgroup>

                    <!-- Group for employers -->
                    <optgroup label="Employers">
                        {% for item in ddpayload.get("employers", []) %}
                        <option value="employer_{{ item.id }}"
                                data-org-type="employer"
                                {% if employer|string == item.id|string and employertype == "employer" %}selected{% endif %}>
                                {{ item.name }}
                        </option>
                        {% endfor %}
                    </optgroup>

                    <!-- Special options -->
                    <option value="EDIT" {% if employer|string == "new" or employer|string == "edit" %}selected{% endif %}>Edit...</option>
                    <option value="ADD">Add New...</option>
                </select>

                <!-- Hidden fields for employer data -->
                <input type="hidden" id="{{ achievement }}_rowid" name="{{ achievement }}_rowid" value="{{ achievement }}">
                <input type="hidden" id="{{ achievement }}_employer_id" name="{{ achievement }}_employer_id" value="{{ employer }}">
                <input type="hidden" id="{{ achievement }}_employer" name="{{ achievement }}_employer" value="{{ employername }}">
                <input type="hidden" id="{{ achievement }}_employer_type" name="{{ achievement }}_employer_type"
                       value="{{ employertype }}">
            </div>
        </div>

        <div class="col-md-6">
            <div class="form-group">
                <label for="{{ achievement }}_position_dropdown">Role:</label>
                <select class="form-control position-dropdown" id="{{ achievement }}_position_dropdown" name="{{ achievement }}_position_dropdown">
                    <!-- Group for positions -->
                    <optgroup label="Positions">
                        {% for item in ddpayload.get("positions", []) %}
                        <option value="position_{{ item.id }}"
                                data-role-type="position"
                                data-employer-id="employer_{{ item.employer }}"
                                {% if position|string == item.id|string and employertype == "employer" %}selected{% endif %}>
                                {{ item.name }}
                        </option>
                        {% endfor %}
                    </optgroup>

                    <!-- Group for focuses -->
                    <optgroup label="Study Focus Areas">
                        {% for item in ddpayload.get("focuses", []) %}
                        <option value="focus_{{ item.id }}"
                                data-role-type="focus"
                                data-school-id="school_{{ item.school_id }}"
                                {% if position|string == item.id|string and employertype == "school" %}selected{% endif %}>
                                {{ item.name }} (Focus)
                        </option>
                        {% endfor %}
                    </optgroup>

                    <!-- Special options -->
                    <option value="EDIT" {% if position|string == "new" or position|string == "edit" %}selected{% endif %}>Edit...</option>
                    <option value="ADD">Add New...</option>
                </select>

                <!-- Hidden fields for position data -->
                <input type="hidden" id="{{ achievement }}_position_id" name="{{ achievement }}_position_id" value="{{ position }}">
                <input type="hidden" id="{{ achievement }}_position" name="{{ achievement }}_position" value="{{ positionname }}">
                <input type="hidden" id="{{ achievement }}_position_type" name="{{ achievement }}_position_type"
                       value="{{ 'focus' if employertype == 'school' else 'position' }}">
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="form-group">
                <label for="{{ achievement }}_shortdesc">Short Description:</label>
                <input type="text" class="form-control" id="{{ achievement }}_shortdesc" name="{{ achievement }}_shortdesc" value="{{ shortdesc }}">
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="form-group">
                <label for="{{ achievement }}_longdesc">
                    <input type="checkbox" id="{{ achievement }}_longdesc_enabled" name="{{ achievement }}_longdesc_enabled"
                           {% if achievementstate %}checked{% endif %}>
                    Long Description:
                </label>
                <textarea class="form-control" id="{{ achievement }}_longdesc" name="{{ achievement }}_longdesc">{{ longdesc }}</textarea>
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-12 text-right">
            <button id="deleteRow" type="button" class="btn btn-danger">Remove</button>
        </div>
    </div>

    <hr>
</div>
{% endmacro %}
