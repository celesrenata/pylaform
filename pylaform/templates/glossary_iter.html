{% macro glossary_term(id, term, definition) %}
<div class="card mb-3" id="{{ id }}">
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-11">
                <div class="mb-3">
                    <label for="{{ id }}_term" class="form-label">Term</label>
                    <input type="text" class="form-control" id="{{ id }}_term" name="{{ id }}_term"
                        value="{{ term }}" placeholder="e.g., API, REST, Cloud Computing">
                </div>
                <div class="mb-3">
                    <label for="{{ id }}_definition" class="form-label">Definition</label>
                    <textarea class="form-control" id="{{ id }}_definition" name="{{ id }}_definition"
                        rows="3" placeholder="Provide a clear, concise definition of the term">{{ definition }}</textarea>
                </div>
            </div>
            <div class="col-md-1 text-end">
                <button type="button" class="btn btn-sm btn-outline-danger deleteRow">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
