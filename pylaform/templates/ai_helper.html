<!-- pylaform/templates/ai_helper.html -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/ai_helper.css') }}">

<div class="ai-helper-footer">
    <div class="ai-helper-toggle">
        <div>
            <i class="bi bi-cpu ai-icon"></i>
            <span>AI Resume Helper</span>
            <span class="ai-status-indicator" title="Checking AI connection...">●</span>
        </div>
        <div class="ai-helper-actions">
            <a href="/ai-config" class="ai-settings-link" title="AI Settings">
                <i class="bi bi-gear"></i>
            </a>
            <div class="arrow">
                <i class="bi bi-chevron-up"></i>
            </div>
        </div>
    </div>

    <div class="ai-helper-content">
        <h5>Improve Your Resume Content</h5>
        <p>Select an improvement type and paste your text to get AI assistance.</p>

        <div class="ai-helper-options">
            <div class="ai-helper-option" data-type="tenet">Core Principle/Tenet</div>
            <div class="ai-helper-option" data-type="list">Convert to List</div>
            <div class="ai-helper-option" data-type="sentence_restructure">Restructure Sentence</div>
            <div class="ai-helper-option" data-type="sentence_summarization">Summarize</div>
        </div>

        <div class="form-group ai-helper-input">
            <label for="ai-text-input">Your Text:</label>
            <textarea class="form-control" id="ai-text-input" rows="3" placeholder="Enter text to improve..."></textarea>
                </div>

        <button id="ai-submit" class="btn btn-primary" disabled>Improve Text</button>

        <div class="ai-helper-loading">
            <i class="bi bi-hourglass-split"></i> Processing...
        </div>

        <div class="ai-helper-result" style="display: none;"></div>

        <!-- Add the new Apply button -->
        <button id="ai-apply" class="btn btn-success mt-2" style="display: none;">Apply Improvement</button>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM fully loaded and parsed');

    const aiHelper = document.querySelector('.ai-helper-footer');
    const aiToggle = document.querySelector('.ai-helper-toggle');
    const aiOptions = document.querySelectorAll('.ai-helper-option');
    const aiTextInput = document.getElementById('ai-text-input');
    const aiApplyBtn = document.getElementById('ai-apply');
    const aiSubmitBtn = document.getElementById('ai-submit');
    const aiResultDiv = document.querySelector('.ai-helper-result');
    const aiLoadingDiv = document.querySelector('.ai-helper-loading');
    const aiStatusIndicator = document.querySelector('.ai-status-indicator');

    let selectedImprovement = null;

    console.log('AI Helper elements initialized');

    function checkAiStatus() {
        console.log('Checking AI status');
        fetch('/api/ai-status')
            .then(response => response.json())
            .then(data => {
                console.log('AI status response:', data);
                if (data.status === 'ok') {
                    aiStatusIndicator.classList.remove('status-amber');
                    aiStatusIndicator.classList.add('status-green');
                    aiStatusIndicator.title = 'Connected to Amazon Q';
                } else {
                    aiStatusIndicator.classList.remove('status-green');
                    aiStatusIndicator.classList.add('status-amber');
                    aiStatusIndicator.title = data.message || 'Not connected to Amazon Q';
                }
            })
            .catch(error => {
                console.error('AI status check error:', error);
                aiStatusIndicator.classList.remove('status-green');
                aiStatusIndicator.classList.add('status-amber');
                aiStatusIndicator.title = 'Failed to check Amazon Q connection';
            });
    }

    checkAiStatus();
    setInterval(checkAiStatus, 30000);

    aiToggle.addEventListener('click', function (e) {
        console.log('AI Helper toggle clicked');
        if (!e.target.classList.contains('bi-gear') && !e.target.classList.contains('ai-settings-link')) {
            aiHelper.classList.toggle('expanded');
            console.log('AI Helper expanded state:', aiHelper.classList.contains('expanded'));
        }
    });

    aiOptions.forEach(option => {
        option.addEventListener('click', function () {
            console.log('AI option clicked:', this.dataset.type);
            aiOptions.forEach(o => o.classList.remove('active'));
            this.classList.add('active');
            selectedImprovement = this.dataset.type;
            aiSubmitBtn.disabled = !aiTextInput.value.trim();
        });
    });

    aiTextInput.addEventListener('input', function () {
        console.log('AI text input changed');
        aiSubmitBtn.disabled = !(this.value.trim() && selectedImprovement);
    });

    aiSubmitBtn.addEventListener('click', function () {
        console.log('AI submit button clicked');
        const text = aiTextInput.value.trim();
        if (!text || !selectedImprovement) return;

        console.log('Submitting text for improvement:', text);
        console.log('Improvement type:', selectedImprovement);

        aiResultDiv.style.display = 'none';
        aiLoadingDiv.style.display = 'block';
        aiSubmitBtn.disabled = true;
        aiApplyBtn.style.display = 'none';

        fetch('/api/improve-text', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text: text, type: selectedImprovement})
        })
            .then(response => {
                if (!response.ok) throw new Error(`Server error: ${response.status}`);
                return response.json();
            })
            .then(data => {
                console.log('AI improvement response:', data);
                aiLoadingDiv.style.display = 'none';
                if (data.error) {
                    aiResultDiv.textContent = `Error: ${data.error}`;
                    aiApplyBtn.style.display = 'none';
                } else {
                    aiResultDiv.textContent = data.response;
                    aiApplyBtn.style.display = 'block';
                }
                aiResultDiv.style.display = 'block';
                aiSubmitBtn.disabled = false;
            })
            .catch(error => {
                console.error('API request error:', error);
                aiLoadingDiv.style.display = 'none';
                aiResultDiv.textContent = `Error: ${error}`;
                aiResultDiv.style.display = 'block';
                aiSubmitBtn.disabled = false;
                aiApplyBtn.style.display = 'none';
            });
    });

    aiApplyBtn.addEventListener('click', function () {
        console.log('AI apply button clicked');
        const sourceFieldId = aiTextInput.dataset.sourceFieldId;
        console.log('Source field ID:', sourceFieldId);
        const sourceField = document.getElementById(sourceFieldId);
        if (sourceField && aiResultDiv.textContent) {
            sourceField.value = aiResultDiv.textContent;
            console.log('Applied text:', aiResultDiv.textContent);
            aiHelper.classList.remove('expanded');
            aiResultDiv.textContent = '';
            aiApplyBtn.style.display = 'none';
        }
    });

    aiResultDiv.addEventListener('click', function () {
        console.log('AI result div clicked');
        const text = this.textContent;
        if (text.startsWith('Error:')) return;
        navigator.clipboard.writeText(text)
            .then(() => {
                console.log('Text copied to clipboard');
                const originalText = this.textContent;
                this.textContent = "Copied to clipboard!";
                setTimeout(() => {
                    this.textContent = originalText;
                }, 1500);
            })
            .catch(err => console.error('Could not copy text: ', err));
    });

    window.openAiHelper = function (fieldId, improvementType, textContent) {
        console.log('Opening AI Helper for:', fieldId);

        const textField = document.getElementById(fieldId);
        let text = '';

        // Get the parent container of the current field
        const parentContainer = textField.closest('.summary-item');

        if (parentContainer) {
            // Find both shortdesc and longdesc within the parent container
            const shortDescField = parentContainer.querySelector('[id$="_shortdesc"]');
            const longDescField = parentContainer.querySelector('[id$="_longdesc"]');

            // Combine shortdesc and longdesc
            let shortDesc = shortDescField ? shortDescField.value : '';
            let longDesc = longDescField ? longDescField.value : '';

            // Trim each and handle null/undefined to avoid "null" or "undefined" strings
            shortDesc = shortDesc ? shortDesc.trim() : '';
            longDesc = longDesc ? longDesc.trim() : '';

            // Combine, ensuring no extra whitespace if one is empty
            if (shortDesc && longDesc) {
                text = `${shortDesc}\n\n${longDesc}`;
            } else {
                text = shortDesc || longDesc || ''; // Use whichever is available, or empty string if both are empty
            }

            text = text.trim();
        } else {
            // Fallback to using the provided textContent if we can't find the parent container
            text = textContent || (textField ? textField.value : '');
        }

        console.log('Text to improve:', text);

        // Set the text in the AI helper input
        const aiTextInput = document.getElementById('ai-text-input');
        aiTextInput.value = text;
        aiTextInput.dataset.sourceFieldId = fieldId;

        // Expand the AI helper
        const aiHelper = document.querySelector('.ai-helper-footer');
        aiHelper.classList.add('expanded');
        console.log('AI Helper expanded:', aiHelper.classList.contains('expanded'));

        // Select the appropriate improvement type
        const aiOptions = document.querySelectorAll('.ai-helper-option');
        let matchingOption = Array.from(aiOptions).find(option =>
            option.textContent.toLowerCase() === improvementType.toLowerCase() ||
            option.dataset.type.toLowerCase() === improvementType.toLowerCase()
        );

        if (matchingOption) {
            matchingOption.click();
            console.log('Selected improvement type:', matchingOption.dataset.type);
        } else {
            console.log('No matching improvement type found for:', improvementType);
        }

        // Focus on the input
        aiTextInput.focus();

        // Ensure the AI helper is visible
        aiHelper.style.display = 'block';
        console.log('AI Helper display style:', aiHelper.style.display);
    }
});
</script>
